<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#087f8c" />
    <title>Health Copilot · Offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5fbfc; color: #17333a; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
      main { width: min(100%, 420px); padding: 32px; text-align: center; border: 1px solid #d8e8eb; border-radius: 28px; background: #fff; box-shadow: 0 22px 65px #12343d12; }
      img { width: 76px; height: 76px; border-radius: 20px; }
      h1 { margin: 20px 0 10px; font-size: 1.6rem; }
      p { margin: 0; color: #587078; line-height: 1.65; }
      button { margin-top: 24px; padding: 12px 20px; border: 0; border-radius: 14px; background: #087f8c; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/health-copilot-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Health Copilot needs an internet connection to load your private health information. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
